<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laptop & Phone Repair Guides — Step by Step | TechTest</title>
  <meta name="description" content="Free step-by-step repair guides for laptops, MacBooks, phones, and gaming devices. Find compatible parts, tools needed, and detailed instructions.">
  <meta name="keywords" content="laptop repair guide, MacBook repair, phone repair guide, DIY laptop repair, screen replacement guide">
  <meta name="robots" content="index, follow">
  <meta property="og:site_name" content="TechTest">
  <meta property="og:type" content="website">
  <meta name="author" content="TechTest">
  <link rel="canonical" href="https://ay5uh.com/repair-guides/">
  <link rel="icon" type="image/png" sizes="512x512" href="/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/shared/styles.css?v=24">


  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "TechTest",
    "url": "https://ay5uh.com",
    "description": "Free browser-based hardware diagnostics for laptops, phones and controllers",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://ay5uh.com/repair-guides/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="Laptop & Phone Repair Guides — Step by Step | TechTest">
  <meta property="og:description" content="Free step-by-step repair guides for laptops, MacBooks, phones, and gaming devices. Find compatible parts, tools needed, and detailed instructions.">
  <meta property="og:url" content="https://ay5uh.com/repair-guides/">
  <meta property="og:image" content="https://ay5uh.com/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Laptop & Phone Repair Guides — Step by Step | TechTest">
  <meta name="twitter:description" content="Free step-by-step repair guides for laptops, MacBooks, phones, and gaming devices. Find compatible parts, tools needed, and detailed instructions.">
  <meta name="twitter:image" content="https://ay5uh.com/og-image.png">

  <!-- Sitemap reference -->
  <link rel="sitemap" type="application/xml" href="https://ay5uh.com/sitemap.xml">

  <!-- Theme Initialization -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('techtest_theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>

  <div class="app-layout">
    <main class="main-content" style="padding: 0; display: flex; flex-direction: column; background: var(--bg);">
      
      <!-- Zone 1: Search -->
      <div class="catalog-top-zone">
        <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 14px 0; color: var(--text-primary); font-family: var(--font-title);">Hardware Repair &amp; Troubleshooting Guides</h1>
        <div class="search-container">
          <i class="fa-solid fa-search search-icon"></i>
          <input type="text" id="catalogSearch" placeholder="e.g. MacBook Air M1, ThinkPad T14, PS5 Drift Fix" autocomplete="off">
          <button id="clearSearch" class="clear-btn" style="display: none;"><i class="fa-solid fa-times"></i></button>
        </div>
      </div>

      <div class="catalog-main-zone">
        <!-- Zone 2: Brand Sidebar -->
        <aside class="catalog-sidebar">
          <div class="sidebar-category">CATALOG</div>
          <div class="brand-link active" data-brand="all">All Guides</div>
          <div class="sidebar-category mt-4">LAPTOPS</div>
          <div class="brand-link" data-brand="lenovo">Lenovo</div>
          <div class="brand-link" data-brand="apple">Apple</div>

          <div class="sidebar-category mt-4">GAMING</div>
          <div class="brand-link" data-brand="playstation">PlayStation</div>

          <div class="sidebar-category mt-4">DISPLAYS</div>
          <div class="brand-link" data-brand="displays">Monitors & Panels</div>
        </aside>

        <!-- Zone 3: Model Grid -->
        <div class="catalog-grid-wrapper">
          <div class="catalog-grid" id="catalogGrid">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/shared/sidebar.js?v=24"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      injectSidebar(null);
      initCatalog();
    });

    const catalogData = {
      lenovo: {
        name: 'Lenovo',
        slug: 'lenovo',
        series: [
          { name: 'ThinkPad T Series', models: [
            { name: 'ThinkPad T14 Gen 1 AMD (Screen Replacement)', slug: 'thinkpad-t14-gen1-amd', hasGuide: true }
          ]}
        ]
      },
      apple: {
        name: 'Apple',
        slug: 'apple',
        series: [
          { name: 'MacBook Air & Pro', models: [
            { name: 'MacBook Air 13" M1 (A2337 Hardware Guide)', slug: 'macbook-air-13-m1', hasGuide: true },
            { name: 'MacBook Keyboard — Cleaning & Key Chatter Fix', slug: 'macbook-keyboard-cleaning', hasGuide: true }
          ]}
        ]
      },
      playstation: {
        name: 'PlayStation',
        slug: 'playstation',
        series: [
          { name: 'Controllers', models: [
            { name: 'PS5 DualSense — Stick Drift Fix & Calibration', slug: '../../fix-ps5-controller-drift', hasGuide: true },
            { name: 'PS5 DualSense — L2 / R2 Trigger Spring Replacement', slug: 'dualsense-trigger-spring', hasGuide: true },
            { name: 'PS4 DualShock 4 — Stick Drift Test & Repair', slug: '../../ps4-controller-drift-test', hasGuide: true }
          ]}
        ]
      },
      displays: {
        name: 'Monitors & Panels',
        slug: 'displays',
        series: [
          { name: 'LCD / IPS / OLED', models: [
            { name: 'Dead vs. Stuck Pixels — Identification & Recovery', slug: 'dead-vs-stuck-pixels', hasGuide: true }
          ]}
        ]
      }
    };

    let activeBrandId = 'all';

    function initCatalog() {
      const searchInput = document.getElementById('catalogSearch');
      const clearBtn = document.getElementById('clearSearch');
      const brandLinks = document.querySelectorAll('.brand-link');

      // Brand click
      brandLinks.forEach(link => {
        link.addEventListener('click', () => {
          brandLinks.forEach(l => l.classList.remove('active'));
          link.classList.add('active');
          activeBrandId = link.dataset.brand;
          searchInput.value = '';
          clearBtn.style.display = 'none';
          renderGrid(activeBrandId, '');
        });
      });

      // Search
      searchInput.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (query.length > 0) {
          clearBtn.style.display = 'block';
          brandLinks.forEach(l => l.classList.remove('active'));
          renderGrid(null, query);
        } else {
          clearBtn.style.display = 'none';
          const activeLink = document.querySelector(`.brand-link[data-brand="${activeBrandId}"]`);
          if (activeLink) activeLink.classList.add('active');
          renderGrid(activeBrandId, '');
        }
      });

      // Clear search
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearBtn.style.display = 'none';
        const activeLink = document.querySelector(`.brand-link[data-brand="${activeBrandId}"]`);
        if (activeLink) activeLink.classList.add('active');
        renderGrid(activeBrandId, '');
      });

      // Handle URL ?q= parameter cleanly
      const urlQuery = new URLSearchParams(window.location.search).get('q');
      if (urlQuery && urlQuery.trim()) {
        searchInput.value = urlQuery.trim();
        clearBtn.style.display = 'block';
        brandLinks.forEach(l => l.classList.remove('active'));
        renderGrid(null, urlQuery.trim().toLowerCase());
      } else {
        renderGrid(activeBrandId, '');
      }
    }

    function renderGrid(brandId, searchQuery) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      let dataToRender = [];

      if (searchQuery) {
        const terms = searchQuery.split(/\s+/);
        Object.values(catalogData).forEach(brand => {
          let matchedSeries = [];
          brand.series.forEach(series => {
            const matchedModels = series.models.filter(model => {
              const hay = `${model.name} ${series.name} ${brand.name}`.toLowerCase();
              return model.hasGuide && terms.every(t => hay.includes(t));
            });
            if (matchedModels.length > 0) {
              matchedSeries.push({ name: series.name, models: matchedModels });
            }
          });
          if (matchedSeries.length > 0) {
            dataToRender.push({ brandSlug: brand.slug, brandName: brand.name, series: matchedSeries });
          }
        });
      } else if (brandId === 'all') {
        Object.values(catalogData).forEach(brand => {
          let matchedSeries = [];
          brand.series.forEach(series => {
            const matchedModels = series.models.filter(model => model.hasGuide);
            if (matchedModels.length > 0) {
              matchedSeries.push({ name: series.name, models: matchedModels });
            }
          });
          if (matchedSeries.length > 0) {
            dataToRender.push({ brandSlug: brand.slug, brandName: brand.name, series: matchedSeries });
          }
        });
      } else if (brandId) {
        // Single brand
        const brand = catalogData[brandId];
        if (brand) {
          let matchedSeries = [];
          brand.series.forEach(series => {
            const matchedModels = series.models.filter(model => model.hasGuide);
            if (matchedModels.length > 0) {
              matchedSeries.push({ name: series.name, models: matchedModels });
            }
          });
          if (matchedSeries.length > 0) {
            dataToRender.push({ brandSlug: brand.slug, brandName: null, series: matchedSeries });
          }
        }
      }

      if (dataToRender.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--text-muted);">No devices found matching your search.</div>';
        return;
      }

      dataToRender.forEach(brandData => {
        brandData.series.forEach(series => {
          const col = document.createElement('div');
          col.className = 'series-column';
          
          const title = document.createElement('h3');
          title.className = 'series-title';
          title.textContent = brandData.brandName ? `${brandData.brandName} ${series.name}` : series.name;
          col.appendChild(title);

          series.models.forEach(model => {
            const item = document.createElement('a');
            item.className = `model-item ${model.hasGuide ? 'has-guide' : 'no-guide'}`;
            
            // Resolve relative link if starts with '..'
            if (model.slug.startsWith('..')) {
              item.href = model.slug.replace(/^\.\.\/\.\.\//, '/');
              if (!item.href.endsWith('/')) {
                item.href += '/';
              }
            } else {
              item.href = `/repair-guides/${brandData.brandSlug}/${model.slug}/`;
            }
            
            const dot = document.createElement('span');
            dot.className = 'guide-dot';
            item.appendChild(dot);
            
            const text = document.createElement('span');
            text.textContent = model.name;
            item.appendChild(text);
            
            col.appendChild(item);
          });

          grid.appendChild(col);
        });
      });
    }
  </script>
</body>
</html>
